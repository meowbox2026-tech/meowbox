<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Huninn";
        src: url("assets/fonts/huninn-latin-400-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+2000-206F, U+25B6, U+00D7;
        font-display: block;
      }
      @font-face {
        font-family: "Huninn";
        src: url("assets/fonts/huninn-chinese-traditional-400-normal.woff2") format("woff2");
        font-display: block;
      }
      :root {
        --cream: #fff6e8;
        --cocoa: #4a2c22;
        --coral: #e8456f;
        --butter: #ffd56b;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--cream); }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Huninn", sans-serif;
        color: var(--cocoa);
        background: var(--cream);
      }
      .clip { position: absolute; inset: 0; }
      .full { position: absolute; inset: 0; width: 1080px; height: 1920px; }
      .bg-img { position: absolute; inset: -40px; width: 1160px; height: 2000px; object-fit: cover; }
      .cam { position: absolute; inset: 0; transform-origin: 50% 32%; }
      .cam video { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }

      /* Sticker captions — cocoa ink on cream, one coral accent. */
      .cap { pointer-events: none; }
      .cap-box {
        position: absolute;
        left: 64px;
        right: 64px;
        top: 1330px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 22px;
      }
      .kicker {
        display: block;
        padding: 10px 30px 14px;
        border-radius: 999px;
        background: var(--coral);
        color: #fffaf3;
        font-size: 58px;
        line-height: 1.1;
        box-shadow: 0 8px 0 var(--cocoa);
      }
      .headline {
        display: block;
        padding: 26px 44px 34px;
        border: 7px solid var(--cocoa);
        border-radius: 40px;
        background: var(--cream);
        font-size: 124px;
        line-height: 1.05;
        letter-spacing: 0.02em;
        box-shadow: 0 16px 0 var(--cocoa);
        white-space: nowrap;
      }
      .headline em { font-style: normal; color: var(--coral); }
      .headline.sm { font-size: 104px; }
      .ff-badge {
        position: absolute;
        top: 300px;
        right: 48px;
        padding: 10px 26px 14px;
        border-radius: 22px;
        background: var(--cocoa);
        color: var(--butter);
        font-size: 46px;
      }

      /* Level jump card */
      #jump-tint { position: absolute; inset: 0; background: rgba(255, 246, 232, 0.72); }
      .jump-stack {
        position: absolute;
        left: 0;
        right: 0;
        top: 520px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      .jump-label { display: block; font-size: 92px; letter-spacing: 0.12em; }
      .jump-num {
        display: block;
        width: 760px;
        text-align: center;
        font-size: 420px;
        line-height: 1;
        color: var(--coral);
        font-variant-numeric: tabular-nums;
        -webkit-text-stroke: 12px var(--cocoa);
        paint-order: stroke fill;
        text-shadow: 0 22px 0 var(--cocoa);
      }
      .jump-q { position: absolute; left: 64px; right: 64px; top: 1330px; display: flex; justify-content: center; }

      /* Chain counter */
      .chain {
        position: absolute;
        left: 64px;
        top: 1360px;
        display: flex;
        align-items: center;
        gap: 30px;
        padding: 24px 56px 34px 44px;
        border: 7px solid var(--cocoa);
        border-radius: 44px;
        background: var(--cream);
        box-shadow: 0 16px 0 var(--cocoa);
      }
      .chain-label { display: block; font-size: 88px; }
      .chain-num {
        display: block;
        width: 330px;
        font-size: 200px;
        line-height: 1;
        color: var(--coral);
        font-variant-numeric: tabular-nums;
        transform-origin: 30% 60%;
      }

      /* Confetti */
      .confetti i { position: absolute; top: 0; display: block; width: 26px; height: 40px; border-radius: 6px; }

      /* CTA */
      .cta-stack {
        position: absolute;
        left: 0;
        right: 0;
        top: 300px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 40px;
      }
      .cta-logo { display: block; width: 640px; height: 640px; object-fit: contain; }
      .cta-q {
        display: block;
        padding: 30px 54px 40px;
        border: 7px solid var(--cocoa);
        border-radius: 44px;
        background: var(--cream);
        font-size: 112px;
        line-height: 1.05;
        box-shadow: 0 16px 0 var(--cocoa);
        white-space: nowrap;
      }
      .cta-name { display: block; font-size: 60px; letter-spacing: 0.06em; }
      .cta-pill {
        display: block;
        margin-top: 20px;
        padding: 26px 70px 34px;
        border-radius: 999px;
        background: var(--coral);
        color: #fffaf3;
        font-size: 78px;
        box-shadow: 0 14px 0 var(--cocoa);
      }
      #flash { position: absolute; inset: 0; background: #fffaf3; opacity: 0; pointer-events: none; }

      .tap { position: absolute; left: 0; top: 0; width: 0; height: 0; }
      .tap-dot { position: absolute; left: -46px; top: -46px; width: 92px; height: 92px; border-radius: 50%;
        background: rgba(255, 250, 243, 0.55); border: 7px solid var(--cocoa); box-shadow: 0 6px 0 rgba(74, 44, 34, 0.35); }
      .tap-ring { position: absolute; left: -46px; top: -46px; width: 92px; height: 92px; border-radius: 50%;
        border: 6px solid var(--coral); opacity: 0; }
      .shout { position: absolute; display: block; padding: 14px 30px 20px; border-radius: 26px; background: var(--coral);
        color: #fffaf3; font-size: 64px; box-shadow: 0 10px 0 var(--cocoa); white-space: nowrap; }
      .fact { display: block; font-size: 54px; padding: 12px 30px 18px; border-radius: 22px; background: var(--cocoa); color: var(--butter); }
      #dim { position: absolute; inset: 0; background: rgba(74, 44, 34, 0.35); opacity: 0; }
      .arrow { position: absolute; left: 800px; top: 330px; font-size: 120px; color: var(--coral); -webkit-text-stroke: 6px var(--cocoa); paint-order: stroke fill; }
      .opt { position: absolute; left: 0; top: 0; width: 0; height: 0; }
      .opt-badge { position: absolute; left: -58px; top: -58px; width: 116px; height: 116px; border-radius: 30px;
        display: flex; align-items: center; justify-content: center; background: var(--coral); color: #fffaf3;
        font-size: 76px; line-height: 1; border: 7px solid var(--cocoa); box-shadow: 0 8px 0 var(--cocoa); }
      .count { position: absolute; right: 56px; top: 316px; width: 150px; height: 150px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center; background: var(--cream); border: 8px solid var(--cocoa);
        box-shadow: 0 10px 0 var(--cocoa); font-size: 96px; color: var(--coral); font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="quiz16" data-start="0" data-duration="15.6" data-width="1080" data-height="1920">
      <div id="bg" class="full"><img class="bg-img" id="bg-img" src="assets/img/bg-main.webp" alt="" /></div>
      <div class="cam" id="cam">
        <video id="vA" src="assets/footage/l1-win.mp4" data-start="0" data-duration="5.1" data-media-start="0.9" data-track-index="0" playsinline muted></video>
        <video id="vB" src="assets/footage/l2-plan.mp4" data-start="5.9" data-duration="2.7" data-media-start="0.9" data-track-index="0" playsinline muted></video>
        <video id="vC" src="assets/footage/l2-plan.mp4" data-start="8.6" data-duration="5" data-media-start="3.6" data-playback-rate="0.1" data-track-index="0" playsinline muted></video>
      </div>
      <div class="tap" id="tap"><div class="tap-ring" id="tap-ring"></div><div class="tap-dot" id="tap-dot"></div></div>

      <div id="cA" class="clip cap" data-start="0.1" data-duration="5" data-track-index="3">
        <div class="cap-box" style="top: 1500px"><span class="kicker" id="cAk">第 1 關</span><span class="headline sm" id="cAh">簡單！</span><span class="headline sm" id="cAh2" style="position: absolute; top: 96px">輕鬆過關 <em>✓</em></span></div>

        <div class="jump-stack" id="jump-stack"><span class="jump-label">LEVEL</span><span class="jump-num" id="jump-num">2</span></div>
        <div class="jump-q"><span class="headline sm" id="jump-q">那第 <em>2</em> 關呢？</span></div>
      </div>
      <div id="cB" class="clip cap" data-start="5.9" data-duration="2.7" data-track-index="3">
        <div class="cap-box" style="top: 1500px"><span class="kicker" id="cBk">第 2 關</span><span class="headline sm" id="cBh" style="font-size: 92px">前 3 隻都對了……</span></div>
      </div>
      <div id="cC" class="clip cap" data-start="8.6" data-duration="5" data-track-index="3">

        <div class="count" id="count"><span id="count-n">3</span></div>
        <div class="cap-box" style="top: 1470px"><span class="headline sm" id="cCh">最後一隻放哪裡？</span><span class="fact" id="cCf">留言你的答案 A、B 還是 C</span></div>

          <span class="cta-name" id="cta-name">MEOW LINE｜貓咪落下連線</span>
          <span class="cta-pill" id="cta-pill">App Store 免費下載</span>
        </div>
      </div>

      <audio id="bgm" src="assets/audio/geoffharvey-excuse-me-cat-150613.mp3" data-start="0" data-duration="15.6" data-volume="0.6" data-track-index="10"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0.9},{"t":8.5,"v":0.9},{"t":8.8,"v":0.45},{"t":13.5,"v":0.45},{"t":13.7,"v":1},{"t":14.9,"v":1},{"t":15.6,"v":0}]}]}'></audio>
      <audio id="tap1" src="assets/audio/andressamd-pop-click-576326.mp3" data-start="0.3" data-duration="0.3" data-track-index="11"></audio>
      <audio id="tap2" src="assets/audio/andressamd-pop-click-576326.mp3" data-start="1.207" data-duration="0.3" data-track-index="14"></audio>
      <audio id="tap3" src="assets/audio/andressamd-pop-click-576326.mp3" data-start="2.115" data-duration="0.3" data-track-index="11"></audio>

      <audio id="tap5" src="assets/audio/andressamd-pop-click-576326.mp3" data-start="7.111" data-duration="0.3" data-track-index="11"></audio>

      <audio id="optB-pop" src="assets/audio/andressamd-pop-click-576326.mp3" data-start="9.15" data-duration="0.25" data-track-index="13"></audio>
      <audio id="optC-pop" src="assets/audio/andressamd-pop-click-576326.mp3" data-start="9.45" data-duration="0.25" data-track-index="12"></audio>
      <audio id="tick3" src="assets/audio/andressamd-pop-click-576326.mp3" data-start="10.6" data-duration="0.3" data-track-index="13"></audio>
      <audio id="tick2" src="assets/audio/andressamd-pop-click-576326.mp3" data-start="11.6" data-duration="0.3" data-track-index="13"></audio>
      <audio id="tick1" src="assets/audio/andressamd-pop-click-576326.mp3" data-start="12.6" data-duration="0.3" data-track-index="13"></audio>

    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#bg-img", { scale: 1, y: 0 }, { scale: 1.05, y: -24, duration: 15.6, ease: "none" }, 0);

      const TAPS = [{"t": 0.3, "x": 600, "y": 867}, {"t": 1.207, "x": 600, "y": 746}, {"t": 2.115, "x": 600, "y": 626}, {"t": 6.202, "x": 238, "y": 505}, {"t": 7.111, "x": 842, "y": 505}, {"t": 8.018, "x": 842, "y": 1109}];
      tl.fromTo("#tap", { x: 540, y: 1250, opacity: 0 }, { x: 540, y: 1250, opacity: 0, duration: 0.01 }, 0);
      [[0.0, 2.6], [5.9, 8.5]].forEach(([on, off]) => {
        tl.fromTo("#tap", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "none", immediateRender: false }, on);
        tl.to("#tap", { opacity: 0, duration: 0.15, ease: "none" }, off);
      });
      let prevEnd = 0;
      TAPS.forEach(tp => {
        const from = Math.max(prevEnd, tp.t - 0.42);
        tl.to("#tap", { x: tp.x, y: tp.y, duration: tp.t - from, ease: "power2.inOut" }, from);
        tl.fromTo("#tap-dot", { scale: 1 }, { scale: 0.78, duration: 0.07, yoyo: true, repeat: 1, ease: "power1.inOut", immediateRender: false }, tp.t);
        tl.fromTo("#tap-ring", { scale: 1, opacity: 0.9 }, { scale: 2.2, opacity: 0, duration: 0.4, ease: "power2.out", immediateRender: false }, tp.t);
        prevEnd = tp.t + 0.12;
      });

      // Level 1 win
      tl.fromTo("#cAk", { x: -260, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: "expo.out" }, 0.1);
      tl.fromTo("#cAh", { scale: 1.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "power4.out" }, 0.3);
      tl.to("#cAh", { opacity: 0, duration: 0.2, ease: "none" }, 4.25);
      tl.fromTo("#cAh2", { scale: 0.4, opacity: 0, rotation: -6 }, { scale: 1, opacity: 1, rotation: -2, duration: 0.4, ease: "back.out(2)" }, 4.4);
      // Level card
      tl.fromTo("#flash", { opacity: 0.9 }, { opacity: 0, duration: 0.2, ease: "power2.out", immediateRender: false }, 5.1);
      tl.fromTo("#jump-num", { scale: 0.4, rotation: -10 }, { scale: 1, rotation: 0, duration: 0.4, ease: "back.out(2)" }, 5.12);
      tl.fromTo("#jump-q", { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "back.out(1.8)" }, 5.3);
      // Level 2 planning
      tl.fromTo("#cBk", { y: -40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "circ.out" }, 5.9);
      tl.fromTo("#cBh", { x: 380, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: "expo.out" }, 7.4);
      // Quiz: options pop on, countdown, no reveal
      tl.fromTo("#cam", { scale: 1 }, { scale: 1.03, duration: 5, ease: "sine.inOut", immediateRender: false }, 8.6);
      tl.fromTo("#cCh", { scale: 1.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "power4.out" }, 8.65);
      ["#optAb", "#optBb", "#optCb"].forEach((sel, i) => {
        tl.fromTo(sel, { scale: 0, rotation: -20 }, { scale: 1, rotation: 0, duration: 0.35, ease: "back.out(2.4)" }, 8.85 + i * 0.3);
        tl.fromTo(sel, { y: 0 }, { y: -12, duration: 0.3, repeat: 5, yoyo: true, ease: "sine.inOut", immediateRender: false }, 9.9 + i * 0.12);
      });
      tl.fromTo("#cCf", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "expo.out" }, 9.8);
      const countN = document.getElementById("count-n");
      const cd = { v: 3 };
      tl.fromTo("#count", { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(2)" }, 10.4);
      tl.fromTo(cd, { v: 3 }, { v: 1, duration: 2.0, ease: "steps(2)", onUpdate: () => { countN.textContent = String(Math.round(cd.v)); } }, 10.6);
      [10.6, 11.6, 12.6].forEach(t => tl.fromTo("#count-n", { scale: 1.5 }, { scale: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, t));
      // CTA
      tl.fromTo("#flash", { opacity: 0.85 }, { opacity: 0, duration: 0.25, ease: "power2.out", immediateRender: false }, 13.6);
      tl.fromTo("#cta-logo", { scale: 0, rotation: -12 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(1.7)" }, 13.62);
      tl.fromTo("#cta-q", { y: 90, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "expo.out" }, 13.85);
      tl.fromTo("#cta-name", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 14.05);
      tl.fromTo("#cta-pill", { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2)" }, 14.2);
      tl.fromTo("#cta-pill", { scale: 1 }, { scale: 1.06, duration: 0.4, repeat: 1, yoyo: true, ease: "sine.inOut", immediateRender: false }, 14.7);
      window.__timelines["quiz16"] = tl;
      tl.seek(0);
    </script>
