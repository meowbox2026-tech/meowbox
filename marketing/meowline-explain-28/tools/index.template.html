<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <!-- Generated from tools/index.template.html by tools/build.py — edit tools/, not index.html. -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Huninn";
        src: url("assets/fonts/huninn-latin-400-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+2000-206F, U+00D7;
        font-display: block;
      }
      @font-face {
        font-family: "Huninn";
        src: url("assets/fonts/huninn-chinese-traditional-400-normal.woff2") format("woff2");
        font-display: block;
      }
      :root {
        --cream: #fff6e8;
        --ink: #33231b;
        --muted: #7a5a48;
        --marker: #e8456f;
        --good: #2f8f5b;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--cream); }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Huninn", sans-serif;
        color: var(--ink);
        background: var(--cream);
      }
      .clip { position: absolute; inset: 0; }
      #cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      #cam video { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }
      .mark { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
      .mark path { fill: none; stroke: var(--marker); stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }

      .tap { position: absolute; left: 0; top: 0; width: 0; height: 0; opacity: 0; }
      .tap-dot { position: absolute; left: -44px; top: -44px; width: 88px; height: 88px; border-radius: 50%;
        background: rgba(255, 255, 255, 0.45); border: 5px solid rgba(51, 35, 27, 0.75); }
      .tap-ring { position: absolute; left: -44px; top: -44px; width: 88px; height: 88px; border-radius: 50%;
        border: 5px solid #ffffff; opacity: 0; }

      #scrim {
        position: absolute;
        left: 0; right: 0; bottom: 0; height: 640px;
        background: linear-gradient(to bottom, rgba(30, 18, 12, 0), rgba(30, 18, 12, 0.5));
      }

      /* Series tag: the same corner label on every episode. */
      #series { opacity: 0; }
      .series-tag {
        position: absolute; left: 36px; top: 40px;
        padding: 12px 26px 14px;
        border-radius: 14px;
        background: var(--cream);
        border: 4px solid var(--ink);
        font-size: 40px; line-height: 1;
        letter-spacing: 0.04em;
      }
      .series-tag b { font-weight: 400; color: #c0254c; }

      .sec-box { position: absolute; left: 0; right: 0; top: 1500px; text-align: center; }
      .sec-box span {
        display: inline-block;
        padding: 10px 24px 12px;
        border-radius: 12px;
        background: var(--cream);
        color: var(--ink);
        font-size: 44px; line-height: 1;
        letter-spacing: 0.04em;
      }
      .sec-box span.bad { background: var(--marker); color: #fffaf3; }
      .sec-box span.good { background: var(--good); color: #fffaf3; }

      .cap-box { position: absolute; left: 50px; right: 50px; top: 1590px; text-align: center; }
      .cap-box > span {
        display: inline-block;
        font-size: 72px;
        line-height: 1.3;
        letter-spacing: 0.02em;
        color: #ffffff;
        -webkit-text-stroke: 11px var(--ink);
        paint-order: stroke fill;
        text-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);
      }
      .cap-box .hi { color: #ffd56b; }

      /* Recap + CTA card */
      #card { background: var(--cream); }
      .card-head { position: absolute; left: 110px; top: 250px; font-size: 52px; color: var(--muted); letter-spacing: 0.06em; }
      .card-title { position: absolute; left: 110px; top: 330px; font-size: 104px; line-height: 1.1; }
      .card-title .mark { left: -10px; top: 110px; width: 460px; height: 50px; }
      .points { position: absolute; left: 110px; right: 80px; top: 560px; display: flex; flex-direction: column; gap: 46px; }
      .point { display: flex; align-items: baseline; gap: 30px; font-size: 66px; line-height: 1.2; opacity: 0; }
      .point i { font-style: normal; display: inline-block; width: 74px; color: var(--marker); font-size: 72px; }
      .cta { position: absolute; left: 0; right: 0; top: 1120px; display: flex; flex-direction: column; align-items: center; opacity: 0; }
      .cta-q { font-size: 64px; }
      .cta-row { display: flex; align-items: center; gap: 30px; margin-top: 56px; }
      .cta-logo { width: 220px; height: 220px; object-fit: contain; }
      .cta-name { display: block; font-size: 50px; letter-spacing: 0.06em; }
      .cta-sub { display: block; margin-top: 14px; font-size: 42px; color: var(--muted); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="{{COMP_ID}}" data-start="0" data-duration="{{TOTAL}}" data-width="1080" data-height="1920">

      <div id="cam">
{{VIDEOS}}
        <svg class="mark" viewBox="0 0 1080 1920" aria-hidden="true">
{{MARK_PATHS}}
        </svg>
        <div class="tap" id="tap"><div class="tap-ring" id="tap-ring"></div><div class="tap-dot" id="tap-dot"></div></div>
      </div>

      <div id="scrim"></div>
      <div id="series" class="clip" data-start="0" data-duration="{{FOOTAGE_END}}" data-track-index="1"><span class="series-tag">關卡解說 <b>#28</b></span></div>

{{SECTIONS}}

{{CAPTIONS}}

      <div id="card" class="clip" data-start="{{CARD_START}}" data-duration="{{CARD_DUR}}" data-track-index="4">
        <span class="card-head">關卡解說 #28</span>
        <span class="card-title" id="card-title">重點整理
          <svg class="mark" viewBox="0 0 460 50" aria-hidden="true"><path id="title-line" pathLength="1" d="M 12 30 C 120 18, 250 16, 360 24 C 400 26, 430 30, 448 26" /></svg>
        </span>
        <div class="points">
          <span class="point" id="p1"><i>1</i>找引爆點</span>
          <span class="point" id="p2"><i>2</i>連好的排，先留著</span>
          <span class="point" id="p3"><i>3</i>最後一隻，補完整排</span>
        </div>
        <div class="cta" id="cta">
          <span class="cta-q">你卡在哪一關？留言告訴我</span>
          <div class="cta-row">
            <img class="cta-logo" src="assets/img/meowlogo.webp" alt="MEOW LINE" />
            <div><span class="cta-name">MEOW LINE｜貓咪落下連線</span><span class="cta-sub">App Store 免費下載</span></div>
          </div>
        </div>
      </div>

      <audio id="bgm" src="assets/audio/geoffharvey-excuse-me-cat-150613.mp3" data-start="0" data-duration="{{TOTAL}}" data-volume="1" data-track-index="10"
        data-automation='{{BGM_AUTOMATION}}'></audio>
{{VO}}
{{POPS}}
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const CARD = {{CARD_START}};
      const CUES = {{CARD_CUES}};

      document.querySelectorAll(".cap, .sec").forEach(clip => {
        tl.fromTo(clip, { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none" }, Number(clip.dataset.start));
      });
      tl.to("#series", { opacity: 1, duration: 0.25, ease: "none" }, {{SERIES_IN}});

      {{CAM_JS}}

      {{MARKS_JS}}

      const TAPS = {{TAPS}};
      tl.set("#tap", { x: TAPS[0].x, y: TAPS[0].y + 160, opacity: 0 }, 0);
      let prevEnd = 0;
      TAPS.forEach((tp, i) => {
        const lead = Math.min(0.45, Math.max(0.12, tp.t - prevEnd - 0.05));
        const from = tp.t - lead;
        tl.to("#tap", { opacity: 1, duration: 0.1, ease: "none" }, from);
        tl.to("#tap", { x: tp.x, y: tp.y, duration: lead, ease: "power2.inOut" }, from);
        tl.fromTo("#tap-dot", { scale: 1 }, { scale: 0.8, duration: 0.07, yoyo: true, repeat: 1, ease: "power1.inOut", immediateRender: false }, tp.t);
        tl.fromTo("#tap-ring", { scale: 1, opacity: 0.9 }, { scale: 2, opacity: 0, duration: 0.4, ease: "power2.out", immediateRender: false }, tp.t);
        const next = TAPS[i + 1];
        if (!next || next.t - tp.t > 1.6) tl.to("#tap", { opacity: 0, duration: 0.2, ease: "none" }, tp.t + 0.6);
        prevEnd = tp.t + 0.1;
      });

      tl.fromTo("#card", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "none" }, CARD);
      tl.fromTo("#card-title", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power2.out" }, CARD + 0.1);
      tl.set("#title-line", { strokeDasharray: 1, strokeDashoffset: 1, opacity: 0 }, 0);
      tl.set("#title-line", { opacity: 1 }, CARD + 0.45);
      tl.to("#title-line", { strokeDashoffset: 0, duration: 0.4, ease: "power1.inOut" }, CARD + 0.45);
      ["p1", "p2", "p3"].forEach(id => {
        tl.fromTo("#" + id, { x: -24, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: "power2.out" }, CUES[id]);
      });
      tl.fromTo("#cta", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, CUES.cta);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
