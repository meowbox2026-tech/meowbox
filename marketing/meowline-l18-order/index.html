<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>喵序 第18關順序</title>
<style>
  html, body { margin: 0; height: 100%; background: #1d140e; display: grid; place-items: center; font-family: "Huninn", "PingFang TC", sans-serif; }
  .stage { position: relative; height: min(100vh, 177.78vw); aspect-ratio: 9 / 16; }
  canvas { width: 100%; height: 100%; display: block; border-radius: 12px; }
  .ctrl { position: absolute; inset: auto 0 16px; display: flex; justify-content: center; }
  button { font: inherit; font-size: 15px; padding: 8px 18px; border-radius: 999px; border: 0; background: #ff7a3d; color: #fff; cursor: pointer; }
  button:focus-visible { outline: 3px solid #fff; }
</style>
</head>
<body>
<main class="stage">
  <canvas id="c" width="1080" height="1920" aria-label="喵序第 18 關：放錯順序就斷鏈"></canvas>
  <div class="ctrl"><button id="play">▶ 播放（含音效）</button></div>
</main>
<script src="data.js"></script>
<script>
// 25 秒 9:16 純 JavaScript 動畫。render(t) 只依時間計算畫面，可逐格擷取輸出。
const W = 1080, H = 1920, DUR = 25;
const C = { bg: '#fff4e3', ink: '#3b2416', accent: '#ff7a3d', good: '#2fb36b', bad: '#e5484d', cell: '#d8f1f5', cell2: '#c3e7ee', board: '#8fd3df' };
const ctx = document.getElementById('c').getContext('2d');
const IMG = {};
['blue', 'orange', 'white', 'fishLover'].forEach(k => { IMG[k] = new Image(); IMG[k].src = `assets/${k === 'fishLover' ? 'fish-lover' : k}.png`; });
const LOGO = new Image(); LOGO.src = 'assets/meowlogo.webp';
const D = window.LV, N = D.cats.length, [SI, SJ] = D.swap;
const CELL = 118, BX = (W - CELL * 8) / 2, BY = 560;
const T = { rule: 1.4, place: 3.4, wrong: 6.6, swap: 12.6, right: 14.8, cta: 22 };
const STEP = 0.2, FR = 0.27;

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (t, s, d) => clamp((t - s) / d);
const easeOut = p => 1 - Math.pow(1 - p, 3);
const back = p => { const s = 1.7; return 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2); };
const cellXY = (x, y) => [BX + x * CELL + CELL / 2, BY + y * CELL + CELL / 2];

function text(str, x, y, size, color = C.ink, o = {}) {
  ctx.save(); ctx.font = `900 ${size}px Huninn, "PingFang TC", sans-serif`; ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'middle';
  ctx.globalAlpha = o.alpha ?? 1; ctx.translate(x, y); ctx.rotate(o.rot || 0); ctx.scale(o.scale || 1, o.scale || 1);
  if (o.stroke) { ctx.lineWidth = size * 0.16; ctx.strokeStyle = o.stroke; ctx.lineJoin = 'round'; ctx.strokeText(str, 0, 0); }
  ctx.fillStyle = color; ctx.fillText(str, 0, 0); ctx.restore();
}
function pill(x, y, w, h, color, alpha = 1) { ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = color; ctx.beginPath(); ctx.roundRect(x - w / 2, y - h / 2, w, h, h / 2); ctx.fill(); ctx.restore(); }
function badge(n, x, y, s, color = C.ink, alpha = 1) { // 放置順序號碼（遊戲中消除的優先順序）
  if (!n) return; ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, s, 0, 7); ctx.fill();
  ctx.lineWidth = s * 0.18; ctx.strokeStyle = '#fff'; ctx.stroke(); ctx.restore();
  text(String(n), x, y + 2, s * 1.15, '#fff', { alpha });
}
function cat(type, x, y, size, alpha = 1, order = 0, badgeColor) {
  const img = IMG[type]; if (!img || !img.complete) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.drawImage(img, x - size / 2, y - size / 2, size, size); ctx.restore();
  badge(order, x + size * 0.36, y - size * 0.36, size * 0.2, badgeColor, alpha);
}

// ---------- 棋盤 ----------
const toMap = b => { const m = new Map(); b.forEach((row, y) => row.forEach((c, x) => { if (c) m.set(c[0], { type: c[1], order: c[2], x, y }); })); return m; };
const placed = (pos, n) => { const m = toMap(D.initial); for (let i = 0; i < n; i++) m.set(D.cats[i][0], { type: D.cats[i][1], order: i + 1, x: pos[i][0], y: pos[i][1] }); return m; };
function drawBoardBase() {
  ctx.fillStyle = C.board; ctx.beginPath(); ctx.roundRect(BX - 22, BY - 22, CELL * 8 + 44, CELL * 8 + 44, 40); ctx.fill();
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
    ctx.fillStyle = (x + y) % 2 ? C.cell : C.cell2; ctx.beginPath(); ctx.roundRect(BX + x * CELL + 4, BY + y * CELL + 4, CELL - 8, CELL - 8, 18); ctx.fill();
  }
}
function drawMap(m, o = {}) {
  m.forEach((c, id) => {
    const [px, py] = cellXY(c.x, c.y), pop = o.pop?.has(id) ? o.popP : 0;
    if (o.glow?.has(id)) { ctx.save(); ctx.fillStyle = '#fff'; ctx.globalAlpha = 0.7 * (1 - pop); ctx.beginPath(); ctx.arc(px, py, CELL * 0.5, 0, 7); ctx.fill(); ctx.restore(); }
    const hot = o.hot?.has(id);
    cat(c.type, px, py, CELL * 0.92 * (1 + pop * 0.5) * (hot ? o.hotS : 1), (1 - pop) * (o.dim && !hot ? 0.35 : 1), c.order, hot ? o.hotC : C.ink);
  });
}
// 每段 FR 秒：消除幀先發光再爆開；重力幀依 id 補間位置
function chainState(run, t) {
  const f = run.frames, i = Math.min(f.length - 1, Math.floor(t / FR)), p = clamp((t - i * FR) / FR);
  const prev = i === 0 ? toMap(run.start) : toMap(f[i - 1].b), cur = toMap(f[i].b);
  const waves = f.slice(0, i + 1).filter(x => x.c.length).length;
  if (f[i].c.length) { const s = new Set(f[i].c); return { map: prev, pop: s, glow: s, popP: easeOut(clamp((p - 0.4) / 0.6)), waves, fresh: 1 - p }; }
  const map = new Map(), e = easeOut(p);
  cur.forEach((c, id) => { const a = prev.get(id) || c; map.set(id, { ...c, x: a.x + (c.x - a.x) * e, y: a.y + (c.y - a.y) * e }); });
  return { map, waves, fresh: 0 };
}
const runEnd = run => run.frames.length * FR;

// ---------- 場景 ----------
function bg(t) {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalAlpha = 0.08; ctx.fillStyle = C.accent;
  for (let i = 0; i < 14; i++) { const y = ((i * 170 + t * 60) % (H + 200)) - 100; ctx.beginPath(); ctx.arc((i * 337) % W, y, 26, 0, 7); ctx.fill(); }
  ctx.restore();
}
function sceneHook(t) {
  text('位置全放對了', W / 2, 620, 100, C.ink, { scale: back(prog(t, 0, 0.25)) });
  text(`為什麼還剩 ${D.wrong.remaining} 隻？`, W / 2, 790, 110, C.bad, { scale: back(prog(t, 0.25, 0.3)), stroke: '#fff', rot: Math.sin(t * 7) * 0.025 });
  [0, 1, 2].forEach(i => cat('blue', 300 + i * 240, 1150, 210, prog(t, 0.45 + i * 0.08, 0.2), [2, 0, 6][i]));
}
function sceneRule(t) { // 2 秒：兩條規則
  const lt = t - T.rule;
  drawBoardBase(); drawMap(placed(D.wrongPos, 0));
  ctx.save(); ctx.globalAlpha = 0.95 * prog(lt, 0, 0.15); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.roundRect(60, 670, 960, 560, 48); ctx.fill(); ctx.restore();
  text('第 18 關', W / 2, 760, 80, C.accent, { scale: back(prog(lt, 0, 0.25)) });
  text('① 3 隻同款連線就消', W / 2, 900, 70, C.ink, { scale: back(prog(lt, 0.15, 0.25)) });
  text('② 號碼小的先消', W / 2, 1020, 70, C.ink, { scale: back(prog(lt, 0.4, 0.25)) });
  text('順序對了才會一路連鎖', W / 2, 1140, 56, C.bad, { alpha: prog(lt, 0.7, 0.2) });
}
function tray(n) {
  pill(W / 2, 1720, 1000, 150, '#ffffff', 0.85);
  D.cats.slice(n, n + 10).forEach(([, type], i) => cat(type, 110 + i * 96, 1720, i ? 82 : 104, i ? 0.7 : 1));
}
function scenePlace(t) { // 新手放法快轉
  const lt = t - T.place, n = Math.min(N, Math.floor(lt / STEP)), p = (lt - n * STEP) / STEP;
  pill(W / 2, 360, 620, 120, C.ink); text('新手放法 ⏩', W / 2, 360, 64, '#fff');
  drawBoardBase(); drawMap(placed(D.wrongPos, n));
  if (n < N) { const [x, y] = D.wrongPos[n], [px, py] = cellXY(x, y), e = easeOut(clamp(p / 0.7)); cat(D.cats[n][1], 110 + (px - 110) * e, 1720 + (py - 1720) * e, CELL * 0.92, 1, n + 1); }
  tray(n + 1);
}
function sceneWrong(t) {
  const lt = t - T.wrong, s = chainState(D.wrong, lt), end = runEnd(D.wrong);
  drawBoardBase(); drawMap(s.map, s);
  const stop = prog(lt, end + 0.1, 0.35);
  text(`連鎖 ×${s.waves}`, W / 2, 360, 120, C.accent, { scale: 1 + 0.25 * s.fresh, stroke: '#fff', alpha: s.waves ? 1 - stop : 0 });
  if (stop > 0) { pill(W / 2, 360, 900, 190, C.bad, stop); text(`斷在 ×${D.wrong.waves}，剩 ${D.wrong.remaining} 隻`, W / 2, 360, 92, '#fff', { scale: back(stop) }); }
}
function sceneSwap(t) { // 同樣位置，只對調兩隻藍貓的順序
  const lt = t - T.swap, sw = easeOut(prog(lt, 0.5, 0.7)), m = placed(D.wrongPos, N);
  const a = D.cats[SI][0], b = D.cats[SJ][0], pa = m.get(a), pb = m.get(b);
  // 號碼互換：badge 沿兩格之間的路徑交換
  const hot = new Set([a, b]);
  pill(W / 2, 330, 960, 220, '#fff', 0.95);
  text('高手只改了一件事', W / 2, 290, 74, C.ink);
  text(`同樣位置，第 ${SI + 1} 和第 ${SJ + 1} 隻對調先後`, W / 2, 380, 50, C.good, { alpha: prog(lt, 0.2, 0.2) });
  drawBoardBase();
  const shown = new Map(m); shown.set(a, { ...pa, order: 0 }); shown.set(b, { ...pb, order: 0 });
  drawMap(shown, { hot, hotS: 1 + 0.08 * Math.sin(lt * 9), dim: true });
  const [ax, ay] = cellXY(pa.x, pa.y), [bx, by] = cellXY(pb.x, pb.y), off = CELL * 0.33;
  const lerp = (u, v, k) => u + (v - u) * k, arc = Math.sin(sw * Math.PI) * 120;
  badge(sw < 0.5 ? SI + 1 : SJ + 1, lerp(ax, bx, sw) + off - arc, lerp(ay, by, sw) - off, 30, sw < 1 ? C.accent : C.good);
  badge(sw < 0.5 ? SJ + 1 : SI + 1, lerp(bx, ax, sw) + off + arc, lerp(by, ay, sw) - off, 30, sw < 1 ? C.accent : C.good);
}
function sceneRight(t) {
  const lt = t - T.right, s = chainState(D.sol, lt), end = runEnd(D.sol);
  pill(W / 2, 220, 560, 100, C.good); text('高手的放法', W / 2, 220, 56, '#fff');
  const shake = s.pop ? Math.sin(lt * 70) * 8 * s.fresh : 0;
  ctx.save(); ctx.translate(shake, 0); drawBoardBase(); drawMap(s.map, s); ctx.restore();
  text(`連鎖 ×${s.waves}`, W / 2, 380, 120, C.good, { scale: 1 + 0.25 * s.fresh, stroke: '#fff', alpha: s.waves ? 1 : 0 });
  const done = prog(lt, end, 0.4);
  if (done > 0) text('全部消除！', W / 2, BY + CELL * 4, 180, C.good, { scale: back(done), stroke: '#fff' });
}
function sceneCta(t) {
  const lt = t - T.cta, r = easeOut(prog(lt, 0, 0.6)) * 2300; // 「全部消除」綠圓擴散成片尾底色（轉場接力）
  ctx.save(); ctx.fillStyle = C.good; ctx.beginPath(); ctx.arc(W / 2, BY + CELL * 4, r, 0, 7); ctx.fill(); ctx.restore();
  text('不是運氣', W / 2, 480, 84, '#fff', { alpha: prog(lt, 0.4, 0.3) });
  text('是你算好了順序', W / 2, 610, 104, '#fff', { alpha: prog(lt, 0.7, 0.3), scale: back(prog(lt, 0.7, 0.4)), stroke: C.ink });
  if (LOGO.complete) { ctx.save(); ctx.globalAlpha = prog(lt, 1.1, 0.4); const s = 560; ctx.drawImage(LOGO, W / 2 - s / 2, 780, s, s * LOGO.height / LOGO.width); ctx.restore(); }
  ['blue', 'orange', 'white'].forEach((k, i) => cat(k, 300 + i * 240, 1320 - Math.abs(Math.sin(lt * 4 + i)) * 50, 190, prog(lt, 1.3 + i * 0.15, 0.3), i + 1));
  pill(W / 2, 1600, 760, 140, '#fff', prog(lt, 1.7, 0.3));
  text('App Store 搜尋 MEOW LINE', W / 2, 1600, 54, C.good, { alpha: prog(lt, 1.7, 0.3) });
}

function render(t) {
  bg(t);
  const scenes = [[T.rule, sceneHook], [T.place, sceneRule], [T.wrong, scenePlace], [T.swap, sceneWrong], [T.right, sceneSwap], [T.cta, sceneRight], [Infinity, sceneCta]];
  scenes.find(([end]) => t < end)[1](t);
}
window.render = render; window.DURATION = DUR; // 方便日後逐格錄製

// ---------- 播放與音效 ----------
const pop = new Audio('assets/pop.mp3'), clear = new Audio('assets/clear.wav');
const runCues = (run, start) => run.frames.map((f, i) => f.c.length ? [start + i * FR + FR * 0.4, pop] : null).filter(Boolean);
const cues = [
    ...Array.from({ length: N }, (_, i) => [T.place + i * STEP + STEP * 0.7, pop]),
  ...runCues(D.wrong, T.wrong), ...runCues(D.sol, T.right), [T.right + runEnd(D.sol), clear],
];
let start = null, last = -1, sound = false;
function tick(now) {
  if (start === null) start = now;
  const t = ((now - start) / 1000) % DUR;
  if (sound) cues.forEach(([ct, a]) => { if (last < ct && t >= ct) { const s = a.cloneNode(); s.volume = 0.6; s.play().catch(() => {}); } });
  last = t; render(t); requestAnimationFrame(tick);
}
document.getElementById('play').addEventListener('click', e => { sound = true; start = null; last = -1; e.target.textContent = '↻ 重播'; });
requestAnimationFrame(tick);
</script>
</body>
</html>
